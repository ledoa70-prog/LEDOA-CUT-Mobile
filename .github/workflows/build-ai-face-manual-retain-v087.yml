name: Build LEDOA multiple manual keyframes v0.8.7
on:
  push:
    branches: [ feature/ai-face-manual-retain-v087 ]
    paths: [ 'ai-tracking-v085/**', 'ai-tracking-v086/**', 'ai-tracking-v087/**', '.github/workflows/build-ai-face-manual-retain-v087.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Regression checks
        run: bash ai-tracking-v087/run-tests.sh
      - name: Check v0.8.7 manual correction persistence guards
        run: |
          set -euo pipefail
          grep -q 'path.bridgeShortConfirmedGaps()' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/MainActivity.java
          grep -q 'onManualFaceRegion' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/MainActivity.java
          grep -q 'MANUAL_FACE_BOX_SELECTED' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/FacePath.java
          grep -q 'LEDOA_FACE_FLOW_TRACK_v0.8.7.json' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/MainActivity.java
          grep -q 'path.fillBetweenManualKeyframes()' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/MainActivity.java
          grep -q 'path.nextManualAfter(start)' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/MainActivity.java
          grep -q 'manualAnchorsPreserved' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/MainActivity.java
          grep -q 'manualKeyframes.higherKey(ms)' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/FacePath.java
          grep -q 'manualInterpolatedReviewFrames' ai-tracking-v085/project/app/src/main/java/kr/ledoa/cut/aitest/MainActivity.java
      - name: Restore existing test signing identity
        run: |
          mkdir -p "$HOME/.android"
          base64 -d signing/v037_debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build standalone ARM64 patch
        working-directory: ai-tracking-v085/project
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify standalone APK
        run: |
          set -euo pipefail
          APK=ai-tracking-v085/project/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/ledoa-v087-badging.txt
          grep -q "package: name='kr.ledoa.cut.aiface087'" /tmp/ledoa-v087-badging.txt
          grep -q "versionCode='807'" /tmp/ledoa-v087-badging.txt
          "$SIGNER" verify "$APK"
          cp "$APK" LEDOA_AI_FACE_MULTI_MANUAL_v0.8.7.apk
          sha256sum LEDOA_AI_FACE_MULTI_MANUAL_v0.8.7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LEDOA_AI_FACE_MULTI_MANUAL_v0.8.7_APK
          path: LEDOA_AI_FACE_MULTI_MANUAL_v0.8.7.apk
          if-no-files-found: error
