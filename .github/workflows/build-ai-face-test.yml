name: Build independent AI face mosaic test
on:
  push:
    branches: [ 'feature/ai-face-mosaic-test-v070' ]
    paths:
      - 'ai-face-test-v070.b64'
      - '.github/workflows/build-ai-face-test.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore standalone sources
        run: |
          mkdir -p standalone
          base64 -d ai-face-test-v070.b64 > /tmp/standalone.tar.gz
          tar -xzf /tmp/standalone.tar.gz -C standalone
      - name: Check pure-Java face tracking
        run: |
          cd standalone
          ./tests/run.sh
      - name: Build independent APK
        run: |
          cd standalone
          gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_FACE_MOSAIC_TEST_v0.7.0
          path: standalone/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
