name: Build independent LEDOA AI face mosaic TEST APK
# Re-triggered after repairing legacy recovery YAML on this feature branch
on:
  push:
    branches:
      - feature/ai-face-mosaic-test-v070
    paths:
      - LEDOA_CUT_AI_FACE_TEST_v0.7.0_SOURCE.zip
      - .github/workflows/build-ai-face-test.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip independent test source
        run: |
          set -euo pipefail
          test -f LEDOA_CUT_AI_FACE_TEST_v0.7.0_SOURCE.zip
          mkdir -p /tmp/ledoa-face-source
          unzip -q LEDOA_CUT_AI_FACE_TEST_v0.7.0_SOURCE.zip -d /tmp/ledoa-face-source
          PROJECT=/tmp/ledoa-face-source/LEDOA_CUT_AI_FACE_TEST_v0.7.0_SOURCE
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Apply Android API 35 release compatibility fix
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["PROJECT"])/"app/src/main/java/kr/ledoa/cut/aitest/MainActivity.java"
          s=p.read_text(encoding="utf-8")
          old="if(retriever!=null)retriever.release();"
          assert s.count(old)==1, "Expected exactly one MediaMetadataRetriever release site"
          replacement='if(retriever!=null){try{retriever.release();}catch(java.io.IOException e){android.util.Log.w("LEDOA-AI","MediaMetadataRetriever release failed",e);}}'
          p.write_text(s.replace(old,replacement),encoding="utf-8")
          PY
      - name: Face tracking JVM safety tests
        run: |
          cd "$PROJECT"
          bash tests/run.sh
      - name: Build separate debug APK
        run: |
          cd "$PROJECT"
          gradle --no-daemon :app:assembleDebug
      - name: Verify isolated test package
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='kr.ledoa.cut.aitest'"
          sha256sum "$APK"
      - name: Upload independent APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_AI_FACE_TEST_v0.7.0_APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
