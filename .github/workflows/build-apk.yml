name: Build LEDOA CUT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source/chunk_00'
      - 'source/chunk_01'
      - 'source/chunk_02'
      - 'source/chunk_03'
      - 'source/v034_app_00'
      - 'source/v034_app_01'
      - 'source/v034_app_02'
      - 'source/v034_app_03'
      - 'source/patch_index_034.b64'
      - 'source/patch_styles_034.b64'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep Android signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ledoa-cut-mobile-debug-signing-v1

      - name: Rebuild Android source from chunks
        run: |
          cat source/chunk_00 source/chunk_01 source/chunk_02 source/chunk_03 > source/android.b64
          base64 -d source/android.b64 > source/android.tar.gz
          gzip -t source/android.tar.gz
          rm -rf buildsrc
          mkdir -p buildsrc
          tar -xzf source/android.tar.gz -C buildsrc
          test -f buildsrc/android/app/build.gradle.kts

      - name: Apply v0.3.4 mobile editor patch
        run: |
          set +e
          cat source/v034_app_00 source/v034_app_01 source/v034_app_02 source/v034_app_03 | base64 -d | gzip -dc > buildsrc/android/app/src/main/assets/app.js
          APP_RC=$?
          set -e
          test -s buildsrc/android/app/src/main/assets/app.js
          base64 -d source/patch_index_034.b64 | gzip -dc > buildsrc/android/app/src/main/assets/index.html
          base64 -d source/patch_styles_034.b64 | gzip -dc > buildsrc/android/app/src/main/assets/styles.css
          grep -q 'overlayGestureStart' buildsrc/android/app/src/main/assets/app.js
          grep -q 'loadTextToEditor' buildsrc/android/app/src/main/assets/app.js
          grep -q 'panelWithTextStyle' buildsrc/android/app/src/main/assets/app.js
          grep -q 'runtimeMediaPool' buildsrc/android/app/src/main/assets/app.js
          grep -q 'newTextBtn' buildsrc/android/app/src/main/assets/index.html
          grep -q 'overlayOpacityLabel' buildsrc/android/app/src/main/assets/index.html
          grep -q 'fonts.googleapis.com' buildsrc/android/app/src/main/assets/index.html
          node --check buildsrc/android/app/src/main/assets/app.js

      - name: Enable network fonts and set stable package identity
        run: |
          MANIFEST=buildsrc/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          sed -i 's/applicationId = "[^"]*"/applicationId = "kr.ledoa.cut.mobile"/' buildsrc/android/app/build.gradle.kts
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 34/' buildsrc/android/app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "0.3.4"/' buildsrc/android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -E 'applicationId|versionCode|versionName' buildsrc/android/app/build.gradle.kts

      - name: Build signed debug APK
        working-directory: buildsrc/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and Android signature
        run: |
          APK=buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -p "$APK" assets/app.js | grep -q 'overlayGestureStart'
          unzip -p "$APK" assets/app.js | grep -q 'loadTextToEditor'
          unzip -p "$APK" assets/app.js | grep -q 'runtimeMediaPool'
          unzip -p "$APK" assets/index.html | grep -q '직접 위치'
          unzip -p "$APK" assets/index.html | grep -q '새 문구'
          cp "$APK" LEDOA_CUT_Shorts_v0.3.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Shorts_v0.3.4
          path: LEDOA_CUT_Shorts_v0.3.4.apk
          if-no-files-found: error
