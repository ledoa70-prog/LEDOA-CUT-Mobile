name: Build LEDOA CUT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source/android_v0.3.3.tar.gz'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack v0.3.3 Android source
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          tar -xzf source/android_v0.3.3.tar.gz -C buildsrc
          test -f buildsrc/android/app/build.gradle.kts

      - name: Build unsigned release APK
        working-directory: buildsrc/android
        run: gradle --no-daemon :app:assembleRelease

      - name: Align APK
        run: |
          ZIPALIGN=$(find "${ANDROID_HOME}/build-tools" -name zipalign -type f | sort -V | tail -1)
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -f 4 buildsrc/android/app/build/outputs/apk/release/app-release-unsigned.apk LEDOA_CUT_Shorts_v0.3.3-aligned-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Shorts_v0.3.3_unsigned
          path: LEDOA_CUT_Shorts_v0.3.3-aligned-unsigned.apk
          if-no-files-found: error
