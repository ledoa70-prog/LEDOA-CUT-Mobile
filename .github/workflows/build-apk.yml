name: Build LEDOA CUT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Android source archive
        run: |
          cat source/chunk_00 source/chunk_01 source/chunk_02 source/chunk_03 > source/android.b64
          base64 -d source/android.b64 > source/android.tar.gz
          rm -rf buildsrc
          mkdir -p buildsrc
          tar -xzf source/android.tar.gz -C buildsrc
          test -f buildsrc/android/app/build.gradle.kts

      - name: Build installable APK
        working-directory: buildsrc/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp buildsrc/android/app/build/outputs/apk/debug/app-debug.apk LEDOA_CUT_Shorts_v0.3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Shorts_v0.3.1
          path: LEDOA_CUT_Shorts_v0.3.1.apk
          if-no-files-found: error
