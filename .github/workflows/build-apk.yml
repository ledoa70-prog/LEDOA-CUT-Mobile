name: Build LEDOA CUT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source/chunk_00'
      - 'source/chunk_01'
      - 'source/chunk_02'
      - 'source/chunk_03'
      - 'source/v035_app.b64'
      - 'source/patch_index_034.b64'
      - 'source/patch_styles_034.b64'
      - 'signing/stable_debug.keystore.b64'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Android source from chunks
        run: |
          cat source/chunk_00 source/chunk_01 source/chunk_02 source/chunk_03 > source/android.b64
          base64 -d source/android.b64 > source/android.tar.gz
          gzip -t source/android.tar.gz
          rm -rf buildsrc
          mkdir -p buildsrc
          tar -xzf source/android.tar.gz -C buildsrc
          test -f buildsrc/android/app/build.gradle.kts

      - name: Apply clean v0.3.6 mobile editor patch
        run: |
          base64 -d source/v035_app.b64 | gzip -dc > buildsrc/android/app/src/main/assets/app.js
          base64 -d source/patch_index_034.b64 | gzip -dc > buildsrc/android/app/src/main/assets/index.html
          base64 -d source/patch_styles_034.b64 | gzip -dc > buildsrc/android/app/src/main/assets/styles.css
          sed -i 's/SHORTS · v0.3.5/SHORTS · v0.3.6/g' buildsrc/android/app/src/main/assets/index.html
          test -s buildsrc/android/app/src/main/assets/app.js
          test -s buildsrc/android/app/src/main/assets/index.html
          test -s buildsrc/android/app/src/main/assets/styles.css
          node --check buildsrc/android/app/src/main/assets/app.js
          grep -q 'overlayGestureStart' buildsrc/android/app/src/main/assets/app.js
          grep -q 'loadTextToEditor' buildsrc/android/app/src/main/assets/app.js
          grep -q 'panelWithTextStyle' buildsrc/android/app/src/main/assets/app.js
          grep -q 'runtimeMediaPool' buildsrc/android/app/src/main/assets/app.js
          grep -q 'SHORTS · v0.3.6' buildsrc/android/app/src/main/assets/index.html
          grep -q 'newTextBtn' buildsrc/android/app/src/main/assets/index.html
          grep -q 'overlayOpacityLabel' buildsrc/android/app/src/main/assets/index.html
          grep -q '직접 위치' buildsrc/android/app/src/main/assets/index.html
          grep -q 'fonts.googleapis.com' buildsrc/android/app/src/main/assets/index.html
          grep -q 'android-safe-top' buildsrc/android/app/src/main/assets/styles.css
          ! grep -P '[\x00-\x08\x0B\x0C\x0E-\x1F]' buildsrc/android/app/src/main/assets/index.html

      - name: Use fresh package id and fixed signing key
        run: |
          MANIFEST=buildsrc/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          sed -i 's/applicationId = "[^"]*"/applicationId = "kr.ledoa.cut.standalone"/' buildsrc/android/app/build.gradle.kts
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 36/' buildsrc/android/app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "0.3.6"/' buildsrc/android/app/build.gradle.kts
          mkdir -p ~/.android
          base64 -d signing/stable_debug.keystore.b64 > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
          grep -E 'applicationId|versionCode|versionName' buildsrc/android/app/build.gradle.kts

      - name: Build signed debug APK
        working-directory: buildsrc/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify install package thoroughly
        run: |
          APK=buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -n "$APKSIGNER"
          test -n "$AAPT2"
          test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='kr.ledoa.cut.standalone'" /tmp/badging.txt
          grep -q "launchable-activity: name='kr.ledoa.cut.MainActivity'" /tmp/badging.txt
          unzip -p "$APK" assets/index.html | grep -q 'SHORTS · v0.3.6'
          cp "$APK" LEDOA_CUT_Shorts_v0.3.6.apk
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Shorts_v0.3.6
          path: LEDOA_CUT_Shorts_v0.3.6.apk
          if-no-files-found: error
