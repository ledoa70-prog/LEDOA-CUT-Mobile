name: Build LEDOA CUT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'LEDOA_CUT_Mobile_Shorts_Standalone_v0.6.6_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v0.6.6 source
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q LEDOA_CUT_Mobile_Shorts_Standalone_v0.6.6_SOURCE.zip -d buildsrc
          echo "Top-level extracted files:"
          find buildsrc -maxdepth 3 -type f | head -100
          GRADLE_FILE=$(find buildsrc -type f \( -name build.gradle.kts -o -name build.gradle \) | grep '/app/' | head -1)
          test -n "$GRADLE_FILE"
          ANDROID_DIR=$(dirname "$(dirname "$GRADLE_FILE")")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "APP_GRADLE=$GRADLE_FILE" >> "$GITHUB_ENV"

      - name: Inspect face tracking source
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          echo "APPJS=$APPJS"
          sed -n '3250,3435p' "$APPJS"

      - name: Apply v0.6.7 playback and bidirectional face tracking patch
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          python3 - "$APPJS" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()

          def replace_function(src, signature, new_text):
              start=src.find(signature)
              if start<0: raise SystemExit("missing "+signature)
              brace=src.find('{',start)
              depth=0; quote=None; esc=False; i=brace
              while i<len(src):
                  ch=src[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in ("'",'"','`'): quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return src[:start]+new_text+src[i+1:]
                  i+=1
              raise SystemExit("unterminated "+signature)

          new_prepare=r'''function prepareMedia(g,forPlay=false){
            const ai=activeInfo(g),activeIds=new Set(); if(!ai)return;
            const next=state.clips[ai.idx+1];
            if(next?.type==='video'&&!next.placeholder){const nr=ensureRuntime(next);if(!nr.preloaded){try{nr.el.load();}catch{}nr.preloaded=true;}}
            const items=ai.trans?[ai.trans.prev,ai.trans.cur]:[ai.cur];
            items.forEach(c=>{
              if(c.type!=='video'||c.placeholder)return;
              activeIds.add(c.id);
              const rt=ensureRuntime(c),v=rt.el,target=mediaLocalSourceTime(c,g);
              v.playbackRate=Math.max(.5,Math.min(2,+c.speed||1));
              const drift=Math.abs((Number.isFinite(v.currentTime)?v.currentTime:0)-target);
              if(!forPlay){
                try{v.pause();}catch{}
                if(drift>.025){try{v.currentTime=target}catch{}}
                rt.synced=false;
                rt.lastTarget=target;
              }else{
                const stalled=rt.lastMediaTime!=null && Math.abs((v.currentTime||0)-rt.lastMediaTime)<.002 && rt.lastWall && performance.now()-rt.lastWall>220;
                if(!rt.synced||drift>.22||stalled){try{v.currentTime=target}catch{}}
                rt.lastTarget=target; rt.lastMediaTime=v.currentTime||0; rt.lastWall=performance.now();
                if(v.paused||v.ended||stalled){
                  try{const pp=v.play();if(pp?.then)pp.then(()=>{rt.synced=true;}).catch(()=>{rt.synced=false;});else rt.synced=!v.paused;}catch{rt.synced=false;}
                }else rt.synced=true;
              }
            });
            state.clips.forEach(c=>{if(c.type==='video'&&c.rt?.el&&!activeIds.has(c.id)){try{c.rt.el.pause();}catch{}c.rt.synced=false;c.rt.lastMediaTime=null;c.rt.lastWall=0;}});
            applyVideoAudioGains(ai);
          }'''
          s=replace_function(s,'function prepareMedia(g,forPlay=false)',new_prepare)

          new_play=r'''function play(){
            if(!state.clips.length)return toast('먼저 미디어를 넣어주세요.');
            ensureAudioGraph().catch(()=>{});
            if(state.currentTime>=totalDuration()-.03)state.currentTime=0;
            state.clips.forEach(c=>{if(c.rt){c.rt.synced=false;c.rt.lastMediaTime=null;c.rt.lastWall=0;}});
            renderFrame(state.currentTime,false);
            state.playing=true;state.playStartPerf=performance.now();state.playStartTime=state.currentTime;
            $('playBtn').textContent='Ⅱ';syncMusic(true);cancelAnimationFrame(raf);raf=requestAnimationFrame(playLoop);
          }'''
          s=replace_function(s,'function play()',new_play)

          new_track=r'''async function runTracking(){
            if(faceTracking){faceCancel=true;return;}
            const mask=selectedMask(),clip=mask&&state.clips.find(c=>c.id===mask.clipId);if(!mask||!clip)return toast('먼저 얼굴을 선택하세요.');
            pause();faceTracking=true;faceCancel=false;syncUi();const prog=$('faceMaskProgress061');if(prog)prog.textContent='선택 얼굴 양방향 추적 준비 중…';let tv;
            try{
              const det=await getDetector();if(!det)throw new Error('얼굴 감지 엔진을 불러오지 못했습니다.');
              tv=await trackVideo(clip);const a=mask.identityAnchor||mask.keyframes?.[0];if(!a)throw new Error('얼굴 기준점이 없습니다.');
              const clipStart=+clip.trimStart||0,clipEnd=+clip.trimEnd||+clip.sourceDuration||0;
              const bounds={start:clipStart,end:clipEnd};if(bounds.end-bounds.start<.08)throw new Error('영상 구간이 너무 짧습니다.');
              await seekTrack(tv,a.sourceTime);
              const base=sanitizeFaceBox064({x:a.x,y:a.y,w:a.w,h:a.h,confidence:a.confidence||1},null);
              mask.sourceStart=bounds.start;mask.sourceEnd=bounds.end;
              mask.identityAnchor={sourceTime:a.sourceTime,...base,confidence:1,manual:true,detected:true,directLock:true};
              const span=Math.max(.01,bounds.end-bounds.start),step=Math.max(.066,Math.min(.10,span/900));
              const total=Math.max(1,Math.ceil((a.sourceTime-bounds.start)/step)+Math.ceil((bounds.end-a.sourceTime)/step));
              let done=0;
              const results=[{sourceTime:a.sourceTime,...base,confidence:1}];

              async function pass(dir,limit){
                let prev={...base},good={...base},vel={x:0,y:0},lost=0,t=a.sourceTime+dir*step;
                while(dir>0?t<=limit+.001:t>=limit-.001){
                  if(faceCancel)return;
                  await seekTrack(tv,t);
                  const pred={x:clamp(prev.x+vel.x,0,1-prev.w),y:clamp(prev.y+vel.y,0,1-prev.h),w:prev.w,h:prev.h};
                  const dets=await detect(det,tv,{rect:pred,lost});
                  let cand=chooseDetectedFace064(dets,prev,pred,base,lost);
                  if(cand){
                    const clean=sanitizeFaceBox064(cand,prev);
                    const jump=Math.hypot((clean.x+clean.w/2)-(prev.x+prev.w/2),(clean.y+clean.h/2)-(prev.y+prev.h/2));
                    const sizeRatio=Math.max(clean.w/Math.max(.001,base.w),base.w/Math.max(.001,clean.w));
                    if(jump>.24+Math.min(.16,lost*.025)||sizeRatio>2.15)cand=null;
                  }
                  if(cand){
                    const clean=sanitizeFaceBox064(cand,prev),alpha=cand.dist<.45?.78:cand.dist<.9?.66:.54,next=smooth(prev,clean,alpha);
                    const nx=(next.x+next.w/2)-(prev.x+prev.w/2),ny=(next.y+next.h/2)-(prev.y+prev.h/2);
                    vel={x:vel.x*.35+nx*.65,y:vel.y*.35+ny*.65};prev=sanitizeFaceBox064(next,prev);good={...prev};lost=0;
                    results.push({sourceTime:clamp(t,bounds.start,bounds.end),...prev,confidence:clamp(cand.confidence??.7,.25,1)});
                  }else{
                    lost++;vel={x:vel.x*.55,y:vel.y*.55};
                    const predicted=sanitizeFaceBox064({x:clamp(prev.x+vel.x,0,1-prev.w),y:clamp(prev.y+vel.y,0,1-prev.h),w:prev.w,h:prev.h},prev);
                    prev=lost<=6?predicted:{...good};
                    results.push({sourceTime:clamp(t,bounds.start,bounds.end),...prev,confidence:lost<=6?.16:.10});
                  }
                  done++;if(done%3===0){if(prog)prog.textContent=`선택 얼굴 양방향 추적… ${Math.min(100,Math.round(done/total*100))}% · ${dir>0?'뒤쪽':'앞쪽'} · ${detectorBackend}`;await new Promise(r=>setTimeout(r,0));}
                  t+=dir*step;
                }
              }
              await pass(1,bounds.end);
              if(!faceCancel)await pass(-1,bounds.start);
              if(faceCancel){if(prog)prog.textContent='추적을 취소했습니다.';toast('얼굴 추적을 취소했습니다.');return;}
              results.sort((x,y)=>x.sourceTime-y.sourceTime);
              mask.keyframes=results;mask.tracked=true;mask.trackerVersion=67;mask.identityLock=true;mask.detectorOnly=true;mask.padding=Math.min(mask.padding??.10,.18);
              if(prog)prog.textContent=`추적 완료 · ${results.length}포인트 · 선택 지점 기준 앞/뒤 전체 추적`;
              renderFrame(state.currentTime,false);v038ScheduleAutosave?.(100);toast(`선택 얼굴 전체 추적 완료 · ${results.length}포인트`);
            }catch(e){console.error('v067 face',e);if(prog)prog.textContent=`추적 실패 · ${e?.message||e}`;toast(`얼굴 추적 실패: ${e?.message||e}`);}
            finally{try{tv?.pause();tv?.removeAttribute('src');tv?.load();}catch{}faceTracking=false;faceCancel=false;syncUi();}
          }'''
          s=replace_function(s,'async function runTracking()',new_track)

          open(p,'w',encoding='utf-8').write(s)
          print('Applied v0.6.7 playback + bidirectional face tracking patch')
          PY
          node --check "$APPJS"
          grep -nE 'trackerVersion=67|function prepareMedia|function play\(\)' "$APPJS" | tail -20

      - name: Apply v0.6.8 multi-face box selector
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          python3 - "$APPJS" <<'PY'
          import sys
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          def rf(src,sig,new):
              st=src.find(sig)
              if st<0: raise SystemExit("missing "+sig)
              b=src.find('{',st); dep=0; q=None; esc=False; i=b
              while i<len(src):
                  ch=src[i]
                  if q:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==q: q=None
                  else:
                      if ch in ("'",'"','`'): q=ch
                      elif ch=='{': dep+=1
                      elif ch=='}':
                          dep-=1
                          if dep==0:return src[:st]+new+src[i+1:]
                  i+=1
              raise SystemExit("unterminated "+sig)

          s=rf(s,'function beginSelection()',r'''async function beginSelection(){
            const clip=currentVideoClip();if(!clip)return toast('먼저 영상 클립을 선택하세요.');
            if(faceTracking)return toast('추적이 끝난 뒤 얼굴을 선택해 주세요.');
            pause();if(state.currentTime<clip.start||state.currentTime>clip.end)seek(Math.min(clip.end-.03,clip.start+.03));
            const prog=$('faceMaskProgress061');if(prog)prog.textContent='현재 화면의 얼굴을 모두 찾는 중…';
            renderFrame(state.currentTime,false);
            const rt=ensureRuntime(clip),v=rt?.el;if(!v?.videoWidth)return toast('영상 프레임을 준비하지 못했습니다.');
            try{
              const det=await getDetector();if(!det)throw new Error('내장 얼굴 감지기를 초기화하지 못했습니다.');
              const ds=await detect(det,v,{full:true,lost:99});
              if(!ds.length){faceSelecting=null;renderFrame(state.currentTime,false);if(prog)prog.textContent='현재 화면에서 추적 가능한 얼굴을 찾지 못했습니다. 얼굴이 더 선명한 장면으로 이동해 다시 눌러주세요.';return toast('인식 가능한 얼굴이 없습니다.');}
              const sourceTime=mediaLocalSourceTime(clip,state.currentTime);
              faceSelecting={clipId:clip.id,sourceTime,candidates:ds.map((d,i)=>({id:i,x:clamp(d.x,0,1),y:clamp(d.y,0,1),w:clamp(d.w,.015,1-d.x),h:clamp(d.h,.015,1-d.y),confidence:d.confidence||1})),selected:new Set()};
              renderFrame(state.currentTime,false);drawSelectionGuide();
              if(prog)prog.textContent=`${ds.length}명 인식 · 모자이크할 얼굴 박스를 터치해 체크하세요. 여러 명 선택 가능합니다. 선택 후 [선택 얼굴 추적]을 누르세요.`;
              toast(`얼굴 ${ds.length}명을 찾았습니다. 박스를 선택하세요.`);
            }catch(e){console.error('v068 scan',e);faceSelecting=null;if(prog)prog.textContent='얼굴 전체 검색에 실패했습니다.';toast('얼굴 검색 실패');}
          }''')

          s=rf(s,'function drawSelectionGuide()',r'''function drawSelectionGuide(){
            if(!faceSelecting?.candidates?.length)return;
            const clip=state.clips.find(c=>c.id===faceSelecting.clipId);if(!clip)return;
            ctx.save();ctx.font=`700 ${Math.max(18,canvas.width*.032)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
            faceSelecting.candidates.forEach((r,i)=>{
              const d=sourceRectToCanvas(clip,r,.08);if(!d)return;const on=faceSelecting.selected.has(i);
              ctx.fillStyle=on?'rgba(65,220,120,.18)':'rgba(255,205,89,.10)';
              ctx.strokeStyle=on?'#41dc78':'#ffd36e';ctx.lineWidth=Math.max(3,canvas.width*.005);ctx.setLineDash(on?[]:[10,7]);
              ctx.fillRect(d.x,d.y,d.w,d.h);ctx.strokeRect(d.x,d.y,d.w,d.h);ctx.setLineDash([]);
              const rr=Math.max(14,canvas.width*.022),cx=d.x+rr*.8,cy=d.y+rr*.8;ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.fillStyle=on?'#20b85a':'#d79b20';ctx.fill();
              ctx.fillStyle='#fff';ctx.fillText(on?'✓':String(i+1),cx,cy+1);
            });ctx.restore();
          }''')

          s=rf(s,'function ptrStart(e)',r'''function ptrStart(e){
            if(!faceSelecting?.candidates?.length)return;
            const p=canvasPoint(e),clip=state.clips.find(c=>c.id===faceSelecting.clipId);if(!clip)return;
            e.preventDefault();e.stopImmediatePropagation();
            let hit=-1,best=1e9;
            faceSelecting.candidates.forEach((r,i)=>{const d=sourceRectToCanvas(clip,r,.18);if(!d)return;const inside=p.x>=d.x&&p.x<=d.x+d.w&&p.y>=d.y&&p.y<=d.y+d.h;if(inside){const dd=Math.hypot(p.x-(d.x+d.w/2),p.y-(d.y+d.h/2));if(dd<best){best=dd;hit=i;}}});
            if(hit<0)return;
            if(faceSelecting.selected.has(hit))faceSelecting.selected.delete(hit);else faceSelecting.selected.add(hit);
            renderFrame(state.currentTime,false);drawSelectionGuide();
            const n=faceSelecting.selected.size,prog=$('faceMaskProgress061');if(prog)prog.textContent=`${faceSelecting.candidates.length}명 인식 · ${n}명 선택됨 · 추가 선택하거나 [선택 얼굴 추적]을 누르세요.`;
          }''')
          s=rf(s,'function ptrMove(e)',r'''function ptrMove(e){return;}''')
          s=rf(s,'async function ptrEnd(e)',r'''async function ptrEnd(e){return;}''')

          s=rf(s,'async function runTracking()',r'''async function runTracking(){
            if(faceTracking){faceCancel=true;return;}
            let clip=currentVideoClip(),masks=[];
            if(faceSelecting?.clipId===clip?.id){
              if(!faceSelecting.selected?.size)return toast('모자이크할 얼굴 박스를 먼저 체크하세요.');
              const bounds=clipSourceBounds(clip),sourceTime=faceSelecting.sourceTime;
              for(const i of [...faceSelecting.selected]){
                const d=faceSelecting.candidates[i],anchor={sourceTime,x:d.x,y:d.y,w:d.w,h:d.h,confidence:d.confidence||1,manual:true,detected:true,directLock:true};
                const m={id:uid('face'),clipId:clip.id,mode:'mosaic',strength:18,padding:.10,sourceStart:bounds.start,sourceEnd:bounds.end,identityAnchor:{...anchor},keyframes:[anchor],tracked:false,trackerVersion:68,detectorOnly:true};
                state.faceMasks.push(m);masks.push(m);
              }
              faceSelecting=null;state.selectedFaceMaskId=masks[0]?.id||null;syncUi();renderFrame(state.currentTime,false);
            }else{
              const m=selectedMask();clip=m&&state.clips.find(c=>c.id===m.clipId);if(m&&clip)masks=[m];
            }
            if(!masks.length||!clip)return toast('먼저 얼굴을 선택하세요.');
            pause();faceTracking=true;faceCancel=false;syncUi();const prog=$('faceMaskProgress061');let tv;
            try{
              const det=await getDetector();if(!det)throw new Error('얼굴 감지 엔진을 불러오지 못했습니다.');
              tv=await trackVideo(clip);const bounds=clipSourceBounds(clip);
              for(let mi=0;mi<masks.length;mi++){
                if(faceCancel)break;
                const mask=masks[mi],a=mask.identityAnchor||mask.keyframes?.[0];if(!a)continue;
                if(prog)prog.textContent=`선택 얼굴 ${mi+1}/${masks.length} · 클립 전체 추적 준비…`;
                await seekTrack(tv,a.sourceTime);
                const base=sanitizeFaceBox064({x:a.x,y:a.y,w:a.w,h:a.h,confidence:a.confidence||1},null);
                mask.sourceStart=bounds.start;mask.sourceEnd=bounds.end;mask.identityAnchor={sourceTime:a.sourceTime,...base,confidence:1,manual:true,detected:true,directLock:true};
                const span=Math.max(.01,bounds.end-bounds.start),step=Math.max(.066,Math.min(.10,span/900)),results=[{sourceTime:a.sourceTime,...base,confidence:1}];
                const total=Math.max(1,Math.ceil((a.sourceTime-bounds.start)/step)+Math.ceil((bounds.end-a.sourceTime)/step));let done=0;
                async function pass(dir,limit){
                  let prev={...base},good={...base},vel={x:0,y:0},lost=0,t=a.sourceTime+dir*step;
                  while(dir>0?t<=limit+.001:t>=limit-.001){
                    if(faceCancel)return;
                    await seekTrack(tv,t);const pred={x:clamp(prev.x+vel.x,0,1-prev.w),y:clamp(prev.y+vel.y,0,1-prev.h),w:prev.w,h:prev.h};
                    const ds=await detect(det,tv,{rect:pred,lost}),cand0=chooseDetectedFace064(ds,prev,pred,base,lost);let cand=cand0;
                    if(cand){const z=sanitizeFaceBox064(cand,prev),jump=Math.hypot((z.x+z.w/2)-(prev.x+prev.w/2),(z.y+z.h/2)-(prev.y+prev.h/2)),sr=Math.max(z.w/Math.max(.001,base.w),base.w/Math.max(.001,z.w));if(jump>.20+Math.min(.12,lost*.02)||sr>1.9)cand=null;}
                    if(cand){const clean=sanitizeFaceBox064(cand,prev),next=smooth(prev,clean,cand.dist<.45?.78:cand.dist<.9?.66:.54),nx=(next.x+next.w/2)-(prev.x+prev.w/2),ny=(next.y+next.h/2)-(prev.y+prev.h/2);vel={x:vel.x*.35+nx*.65,y:vel.y*.35+ny*.65};prev=sanitizeFaceBox064(next,prev);good={...prev};lost=0;results.push({sourceTime:clamp(t,bounds.start,bounds.end),...prev,confidence:clamp(cand.confidence??.7,.25,1)});}
                    else{lost++;vel={x:vel.x*.45,y:vel.y*.45};prev={...good};results.push({sourceTime:clamp(t,bounds.start,bounds.end),...prev,confidence:.10});}
                    done++;if(done%4===0){if(prog)prog.textContent=`얼굴 ${mi+1}/${masks.length} 추적 · ${Math.min(100,Math.round(done/total*100))}% · ${dir>0?'뒤쪽':'앞쪽'}`;await new Promise(r=>setTimeout(r,0));}t+=dir*step;
                  }
                }
                await pass(1,bounds.end);if(!faceCancel)await pass(-1,bounds.start);
                results.sort((x,y)=>x.sourceTime-y.sourceTime);mask.keyframes=results;mask.tracked=!faceCancel;mask.trackerVersion=68;mask.identityLock=true;
              }
              if(faceCancel){if(prog)prog.textContent='추적을 취소했습니다.';toast('얼굴 추적을 취소했습니다.');return;}
              state.selectedFaceMaskId=masks[0]?.id||state.selectedFaceMaskId;syncUi();renderFrame(state.currentTime,false);v038ScheduleAutosave?.(100);
              if(prog)prog.textContent=`추적 완료 · 선택한 ${masks.length}명 · 클립 처음부터 끝까지 적용`;toast(`얼굴 ${masks.length}명 전체 추적 완료`);
            }catch(e){console.error('v068 face',e);if(prog)prog.textContent=`추적 실패 · ${e?.message||e}`;toast(`얼굴 추적 실패: ${e?.message||e}`);}
            finally{try{tv?.pause();tv?.removeAttribute('src');tv?.load();}catch{}faceTracking=false;faceCancel=false;syncUi();}
          }''')
          open(p,'w',encoding='utf-8').write(s)
          print('Applied v0.6.8 multi-face selector')
          PY
          node --check "$APPJS"
          grep -nE 'trackerVersion:68|현재 화면의 얼굴을 모두|async function beginSelection' "$APPJS" | tail -20

      - name: Apply v0.6.9 face button auto-scan UI
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          python3 - "$APPJS" <<'PY'
          import sys
          p=sys.argv[1];s=open(p,encoding='utf-8').read()
          # The top clip-sheet Face button already opens the Face panel. Make opening that panel
          # automatically start full-frame face detection, so there is no second selection button.
          needles=[
            "faceMaskSelect061').addEventListener('click',beginSelection)",
            'faceMaskSelect061").addEventListener("click",beginSelection)'
          ]
          # Keep old button as retry, but relabel it.
          s=s.replace('1. 얼굴 터치 선택','얼굴 다시 찾기')
          # Hook the existing top Face tab/button by wrapping updateClipSheet after the face card is visible.
          anchor="const oldUpdateClipSheet061=updateClipSheet;\n  updateClipSheet=function(){oldUpdateClipSheet061();syncUi();};"
          repl="""const oldUpdateClipSheet061=updateClipSheet;
          updateClipSheet=function(){oldUpdateClipSheet061();syncUi();};
          let v069LastAutoScanClip=null,v069LastAutoScanAt=-1;
          function v069AutoScanFaces(){
            const clip=currentVideoClip();if(!clip||faceTracking)return;
            const now=state.currentTime;
            if(v069LastAutoScanClip===clip.id&&Math.abs(now-v069LastAutoScanAt)<.03&&faceSelecting?.candidates?.length)return;
            v069LastAutoScanClip=clip.id;v069LastAutoScanAt=now;
            setTimeout(()=>beginSelection(),80);
          }
          const v069FaceBtn=document.querySelector('[data-sheet="face"],[data-panel="face"],#faceBtn,#clipFaceBtn');
          if(v069FaceBtn)v069FaceBtn.addEventListener('click',()=>setTimeout(v069AutoScanFaces,120),true);
          document.addEventListener('click',e=>{
            const b=e.target?.closest?.('button');if(!b)return;
            if((b.textContent||'').trim()==='얼굴')setTimeout(v069AutoScanFaces,120);
          },true);"""
          if anchor not in s: raise SystemExit("face UI anchor not found")
          s=s.replace(anchor,repl)
          open(p,'w',encoding='utf-8').write(s)
          print('Applied v0.6.9 top Face button auto scan')
          PY
          node --check "$APPJS"
          grep -nE 'v069AutoScanFaces|얼굴 다시 찾기' "$APPJS" | tail -20

      - name: Apply v0.7.0 persistent face selection overlay
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          python3 - "$APPJS" <<'PY'
          import sys
          p=sys.argv[1];s=open(p,encoding='utf-8').read()
          # Replace v0.6.8 canvas-only selection guide with a persistent DOM overlay.
          sig='function drawSelectionGuide()'
          st=s.find(sig)
          if st<0: raise SystemExit('drawSelectionGuide missing')
          b=s.find('{',st);dep=0;q=None;esc=False;i=b
          while i<len(s):
            ch=s[i]
            if q:
              if esc:esc=False
              elif ch=='\\':esc=True
              elif ch==q:q=None
            else:
              if ch in ("'",'"','`'):q=ch
              elif ch=='{':dep+=1
              elif ch=='}':
                dep-=1
                if dep==0:break
            i+=1
          new=r'''function drawSelectionGuide(){
            let layer=document.getElementById('faceSelectOverlay070');
            if(!faceSelecting?.candidates?.length){if(layer)layer.remove();return;}
            const clip=state.clips.find(c=>c.id===faceSelecting.clipId);if(!clip)return;
            const host=canvas.parentElement||document.body,hr=host.getBoundingClientRect(),cr=canvas.getBoundingClientRect();
            if(!layer){layer=document.createElement('div');layer.id='faceSelectOverlay070';layer.style.cssText='position:absolute;z-index:99999;pointer-events:none;overflow:visible';host.appendChild(layer);}
            if(getComputedStyle(host).position==='static')host.style.position='relative';
            layer.style.left=(cr.left-hr.left)+'px';layer.style.top=(cr.top-hr.top)+'px';layer.style.width=cr.width+'px';layer.style.height=cr.height+'px';layer.innerHTML='';
            const sx=cr.width/canvas.width,sy=cr.height/canvas.height;
            faceSelecting.candidates.forEach((r,i)=>{
              const d=sourceRectToCanvas(clip,r,.10);if(!d)return;const on=faceSelecting.selected.has(i),b=document.createElement('button');
              b.type='button';b.dataset.faceIndex=String(i);b.style.cssText=`position:absolute;pointer-events:auto;left:${d.x*sx}px;top:${d.y*sy}px;width:${d.w*sx}px;height:${d.h*sy}px;border:${on?'4px solid #32e875':'3px solid #ffd36e'};background:${on?'rgba(50,232,117,.18)':'rgba(255,211,110,.10)'};border-radius:6px;color:#fff;font-weight:900;font-size:18px;text-shadow:0 1px 3px #000;box-shadow:0 0 0 1px rgba(0,0,0,.5);z-index:100000;`;
              b.textContent=on?'✓':String(i+1);
              b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();if(faceSelecting.selected.has(i))faceSelecting.selected.delete(i);else faceSelecting.selected.add(i);drawSelectionGuide();const prog=$('faceMaskProgress061');if(prog)prog.textContent=`${faceSelecting.candidates.length}명 인식 · ${faceSelecting.selected.size}명 선택됨 · 박스를 추가 선택하거나 [선택 얼굴 추적]을 누르세요.`;});
              layer.appendChild(b);
            });
          }'''
          s=s[:st]+new+s[i+1:]

          # Keep overlay visible after every frame render; remove it when selection ends.
          old="updateTime();\n  updatePlayhead();\n}"
          if old in s:
            s=s.replace(old,"updateTime();\n  updatePlayhead();\n  if(typeof faceSelecting!=='undefined'&&faceSelecting?.candidates?.length)requestAnimationFrame(()=>drawSelectionGuide());\n}",1)
          # Diagnostic: explicit count is already shown; ensure face panel remains above bottom sheet by mounting overlay on body if host clips.
          s=s.replace("const host=canvas.parentElement||document.body,hr=host.getBoundingClientRect(),cr=canvas.getBoundingClientRect();","const host=document.body,hr=host.getBoundingClientRect(),cr=canvas.getBoundingClientRect();")
          s=s.replace("if(getComputedStyle(host).position==='static')host.style.position='relative';","")
          # body coordinates need viewport + scroll.
          s=s.replace("layer.style.left=(cr.left-hr.left)+'px';layer.style.top=(cr.top-hr.top)+'px';","layer.style.left=(cr.left+window.scrollX)+'px';layer.style.top=(cr.top+window.scrollY)+'px';")
          open(p,'w',encoding='utf-8').write(s)
          print('Applied v0.7.0 persistent DOM face boxes')
          PY
          node --check "$APPJS"
          grep -nE 'faceSelectOverlay070|명 인식' "$APPJS" | tail -20

      - name: Verify and normalize v0.7.2 identity
        run: |
          set -euo pipefail
          echo "Using $APP_GRADLE"
          if grep -q 'versionCode[[:space:]]*=' "$APP_GRADLE"; then
            sed -i -E 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 702/' "$APP_GRADLE"
          fi
          if grep -q 'versionName[[:space:]]*=' "$APP_GRADLE"; then
            sed -i -E 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "0.7.2"/' "$APP_GRADLE"
          fi
          grep -E 'applicationId|versionCode|versionName' "$APP_GRADLE" || true

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon :app:assembleDebug
          elif [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Locate and sign APK
        run: |
          set -euo pipefail
          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -1)
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          if [ -f signing/v037_debug.keystore.b64 ]; then
            base64 -d signing/v037_debug.keystore.b64 > /tmp/ledoa-release.keystore
            "$ZIPALIGN" -f 4 "$APK" /tmp/ledoa-aligned.apk
            "$APKSIGNER" sign --ks /tmp/ledoa-release.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out LEDOA_CUT_Mobile_v0.7.2_PREVIEW_ROLLBACK.apk /tmp/ledoa-aligned.apk
            "$APKSIGNER" verify --verbose --print-certs LEDOA_CUT_Mobile_v0.7.2_PREVIEW_ROLLBACK.apk
          else
            cp "$APK" LEDOA_CUT_Mobile_v0.7.2_PREVIEW_ROLLBACK.apk
          fi
          sha256sum LEDOA_CUT_Mobile_v0.7.2_PREVIEW_ROLLBACK.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Mobile_v0.7.2_PREVIEW_ROLLBACK
          path: LEDOA_CUT_Mobile_v0.7.2_PREVIEW_ROLLBACK.apk
          if-no-files-found: error
