name: Build LEDOA CUT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'LEDOA_CUT_Mobile_Shorts_Standalone_v0.6.6_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v0.6.6 source
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q LEDOA_CUT_Mobile_Shorts_Standalone_v0.6.6_SOURCE.zip -d buildsrc
          echo "Top-level extracted files:"
          find buildsrc -maxdepth 3 -type f | head -100
          GRADLE_FILE=$(find buildsrc -type f \( -name build.gradle.kts -o -name build.gradle \) | grep '/app/' | head -1)
          test -n "$GRADLE_FILE"
          ANDROID_DIR=$(dirname "$(dirname "$GRADLE_FILE")")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "APP_GRADLE=$GRADLE_FILE" >> "$GITHUB_ENV"

      - name: Inspect face tracking source
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          echo "APPJS=$APPJS"
          sed -n '3250,3435p' "$APPJS"

      - name: Inspect actual preview DOM and sizing rules
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          HTML=$(find buildsrc -type f -name index.html | head -1)
          CSS=$(find buildsrc -type f -name '*.css' | head -1)
          echo "=== PREVIEW HTML ==="
          grep -nEi 'preview|canvas|stage|9:16|16:9' "$HTML" | head -120 || true
          echo "=== WIDTH / TRANSFORM CSS ==="
          grep -nEi 'min-width|max-width|width:|translate|scale|aspect-ratio|preview|canvas|stage' "$CSS" | head -220 || true
          echo "=== JS SIZING ==="
          grep -nEi 'canvas\.width|canvas\.height|getBoundingClientRect|clientWidth|innerWidth|preview|aspect' "$APPJS" | head -220 || true

      - name: Apply v0.7.5 exact viewer width fix
        run: |
          set -euo pipefail
          HTML=$(find buildsrc -type f -name index.html | head -1)
          CSS=$(find buildsrc -type f -name '*.css' | head -1)
          cat >> "$CSS" <<'CSS'
          /* v0.7.5 exact fix: .viewer had aspect-ratio but no width constraint.
             With a 16:9 ratio its flex height computed a width wider than the Fold cover display. */
          .preview-section{width:100%;max-width:100%;min-width:0;box-sizing:border-box}
          .viewer{
            width:100%!important;
            max-width:100%!important;
            min-width:0!important;
            height:auto;
            box-sizing:border-box!important;
          }
          .viewer.ratio-9-16{width:min(100%,calc((100dvh - 330px)*9/16))!important}
          .viewer.ratio-1-1{width:min(100%,calc(100dvh - 330px))!important}
          .viewer.ratio-16-9{width:100%!important;aspect-ratio:16/9!important}
          #previewCanvas{width:100%!important;height:100%!important}
          .empty-viewer{max-width:100%;box-sizing:border-box}
          CSS
          grep -nE '^\.viewer|^\.preview-section|ratio-16-9' "$CSS" | tail -20

      - name: Apply v0.7.6 viewport shell fix
        run: |
          set -euo pipefail
          HTML=$(find buildsrc -type f -name index.html | head -1)
          CSS=$(find buildsrc -type f -name '*.css' | head -1)
          python3 - "$HTML" "$CSS" <<'PY'
          import sys,re
          hp,cp=sys.argv[1:3]
          h=open(hp,encoding='utf-8').read()
          tag='<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">'
          m=re.search(r'<meta[^>]+name=["\x27]viewport["\x27][^>]*>',h,re.I)
          h=h[:m.start()]+tag+h[m.end():] if m else h.replace('<head>','<head>\n'+tag,1)
          open(hp,'w',encoding='utf-8').write(h)
          s=open(cp,encoding='utf-8').read()
          s += """\n/* v076-shell */\nhtml,body,#app,.app,.app-shell,.main,.main-content{width:100%!important;max-width:100vw!important;min-width:0!important;box-sizing:border-box!important;overflow-x:hidden!important}\n.preview-section{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important}\n.viewer{width:calc(100vw - 32px)!important;max-width:calc(100vw - 32px)!important;min-width:0!important;flex:none!important;margin-left:auto!important;margin-right:auto!important;box-sizing:border-box!important}\n.empty-viewer{left:0!important;right:0!important;width:100%!important;max-width:100%!important;transform:none!important;box-sizing:border-box!important;text-align:center!important}\n"""
          open(cp,'w',encoding='utf-8').write(s)
          PY
          grep -nE 'viewport|v076-shell' "$HTML" "$CSS" | tail -10

      - name: Apply v0.7.7 direct preview geometry override
        run: |
          set -euo pipefail
          HTML=$(find buildsrc -type f -name index.html | head -1)
          CSS=$(find buildsrc -type f -name '*.css' | head -1)
          python3 - "$HTML" "$CSS" <<'PY'
          import sys,re
          hp,cp=sys.argv[1:3]
          h=open(hp,encoding='utf-8').read()
          # Inject last in head so it wins against the original rules.
          css=r'''<style id="v077-direct-preview">
          @media (max-width:700px){
            .preview-section{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;height:auto!important;min-height:0!important;padding:16px!important;box-sizing:border-box!important;overflow:hidden!important}
            .viewer{display:block!important;position:relative!important;flex:none!important;width:100%!important;max-width:100%!important;min-width:0!important;height:auto!important;max-height:none!important;aspect-ratio:16/9!important;margin:0!important;box-sizing:border-box!important;overflow:hidden!important}
            .viewer[data-ratio="9:16"],.viewer.ratio-9-16{aspect-ratio:9/16!important}
            .empty-viewer{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;width:auto!important;height:auto!important;max-width:none!important;transform:none!important;text-align:center!important;padding:16px!important;box-sizing:border-box!important}
          }
          </style>'''
          h=h.replace('</head>',css+'\n</head>')
          open(hp,'w',encoding='utf-8').write(h)
          # Remove earlier experimental overrides so only one narrow-screen authority remains.
          s=open(cp,encoding='utf-8').read()
          s=re.sub(r'/\* v076-shell \*/.*?(?=\n/\*|\Z)','',s,flags=re.S)
          open(cp,'w',encoding='utf-8').write(s)
          PY
          grep -nE 'v077-direct-preview|preview-section|empty-viewer' "$HTML" | tail -15

      - name: Apply v0.7.8 visible version and hard preview fix
        run: |
          set -euo pipefail
          HTML=$(find buildsrc -type f -name index.html | head -1)
          CSS=$(find buildsrc -type f -name '*.css' | head -1)
          python3 - "$HTML" "$CSS" <<'PY'
          import sys,re
          hp,cp=sys.argv[1:3]
          h=open(hp,encoding='utf-8').read()
          # Make the on-screen build identity truthful.
          h=h.replace('SHORTS · v0.6.6','SHORTS · v0.7.8')
          h=h.replace('SHORTS · v0.6.5','SHORTS · v0.7.8')
          # Hard mobile geometry injected last: no dependence on prior cascade.
          css=r'''<style id="v078-hard-mobile-preview">
          @media(max-width:700px){
            body{width:100vw!important;max-width:100vw!important;overflow-x:hidden!important}
            .preview-section{display:block!important;position:relative!important;width:100vw!important;max-width:100vw!important;min-width:0!important;height:auto!important;padding:16px!important;margin:0!important;box-sizing:border-box!important;overflow:hidden!important}
            .viewer{display:block!important;position:relative!important;flex:none!important;width:calc(100vw - 32px)!important;max-width:calc(100vw - 32px)!important;min-width:0!important;height:calc((100vw - 32px)*9/16)!important;max-height:none!important;aspect-ratio:auto!important;margin:0 auto!important;overflow:hidden!important;box-sizing:border-box!important}
            .empty-viewer{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;transform:none!important;text-align:center!important;box-sizing:border-box!important;padding:16px!important}
            .viewer canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:contain!important}
          }
          </style>'''
          h=h.replace('</head>',css+'\n</head>')
          open(hp,'w',encoding='utf-8').write(h)
          open(cp,'a',encoding='utf-8').write('\n/* v0.7.8 source marker */\n')
          PY
          grep -nE 'SHORTS · v0.7.8|v078-hard-mobile-preview' "$HTML"

      - name: Apply v0.7.9 preview decoder recovery patch
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          HTML=$(find buildsrc -type f -name index.html | head -1)
          test -s "$APPJS"
          cat tools/preview_watchdog_v079.js >> "$APPJS"
          node --check "$APPJS"
          sed -i 's/SHORTS · v0.7.8/SHORTS · v0.7.9/g' "$HTML"
          grep -q '__LEDOA_PREVIEW_WATCHDOG_V079__' "$APPJS"
          echo "v0.7.9 decoder recovery source patch verified"

      - name: Restore bundled Korean fonts and verify checksums
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          ASSETS=$(dirname "$APPJS")
          mkdir -p "$ASSETS/fonts"
          if [ ! -s "$ASSETS/fonts/GowunDodum-Regular.ttf" ]; then
            curl -fL --retry 3 --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/gowundodum/GowunDodum-Regular.ttf' -o "$ASSETS/fonts/GowunDodum-Regular.ttf"
          fi
          if [ ! -s "$ASSETS/fonts/NanumPenScript-Regular.ttf" ]; then
            curl -fL --retry 3 --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/nanumpenscript/NanumPenScript-Regular.ttf' -o "$ASSETS/fonts/NanumPenScript-Regular.ttf"
          fi
          echo 'a6e457933227483a11758fd0947bc74422a106d46f0bf057fdaa5af94a30067d  '"$ASSETS/fonts/GowunDodum-Regular.ttf" | sha256sum -c -
          echo '6f0d1ab29c7894010dc88831fb7a0a51edb79136e450344183de5b1a8b52bd43  '"$ASSETS/fonts/NanumPenScript-Regular.ttf" | sha256sum -c -
          curl -fL --retry 3 --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/gowundodum/OFL.txt' -o "$ASSETS/fonts/GowunDodum-OFL.txt"
          curl -fL --retry 3 --silent --show-error 'https://raw.githubusercontent.com/google/fonts/main/ofl/nanumpenscript/OFL.txt' -o "$ASSETS/fonts/NanumPenScript-OFL.txt"
          echo 'Bundled font assets and licences verified.'

      - name: Verify packaged web assets before Android build
        run: |
          set -euo pipefail
          HTML=$(find buildsrc -type f -name index.html | head -1)
          grep -q 'SHORTS · v0.7.9' "$HTML"
          grep -q 'v078-hard-mobile-preview' "$HTML"
          echo "SOURCE VERIFIED: v0.7.8 identity + preview patch present"

      - name: Verify and normalize v0.7.8 verified package identity
        run: |
          set -euo pipefail
          echo "Using $APP_GRADLE"
          if grep -q 'versionCode[[:space:]]*=' "$APP_GRADLE"; then
            sed -i -E 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 800/' "$APP_GRADLE"
          fi
          if grep -q 'versionName[[:space:]]*=' "$APP_GRADLE"; then
            sed -i -E 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "0.8.0"/' "$APP_GRADLE"
          fi
          grep -E 'applicationId|versionCode|versionName' "$APP_GRADLE" || true

      - name: Restore v0.6.4 fonts and zero background opacity in v0.8.0
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -path '*/web/app.js' | head -1)
          CSS=$(find buildsrc -type f -path '*/web/styles.css' | head -1)
          HTML=$(find buildsrc -type f -path '*/web/index.html' | head -1)
          python3 tools/restore_text_v080.py "$APPJS" "$CSS" "$HTML"
          node --check "$APPJS"
          grep -Fq "Number(\$('textBgOpacity')?.value ?? 100)" "$APPJS"
          grep -Fq 'restoreBundledKoreanFontsV080' "$APPJS"
          grep -Fq "@font-face{font-family:'Gowun Dodum'" "$CSS"
          grep -Fq "@font-face{font-family:'Nanum Pen Script'" "$CSS"
          echo "v0.8.0 subtitle opacity and fonts restored."

      - name: Synchronize patched web source into installable Android assets
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -path '*/web/app.js' | head -1)
          WEB_DIR=$(dirname "$APPJS")
          APP_ASSETS="$ANDROID_DIR/app/src/main/assets"
          mkdir -p "$APP_ASSETS"
          cp -a "$WEB_DIR/." "$APP_ASSETS/"
          test -s "$APP_ASSETS/app.js"
          test -s "$APP_ASSETS/fonts/GowunDodum-Regular.ttf"
          test -s "$APP_ASSETS/fonts/NanumPenScript-Regular.ttf"
          grep -q '__LEDOA_PREVIEW_WATCHDOG_V079__' "$APP_ASSETS/app.js"
          grep -q 'SHORTS · v0.8.0' "$APP_ASSETS/index.html"
          echo 'Android app assets synchronized from final patched web.'

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon :app:assembleDebug
          elif [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Locate and sign APK
        run: |
          set -euo pipefail
          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -1)
          test -f "$APK"
          unzip -p "$APK" assets/app.js > /tmp/ledoa-v080-app.js
          grep -q '__LEDOA_PREVIEW_WATCHDOG_V079__' /tmp/ledoa-v080-app.js
          unzip -p "$APK" assets/index.html | grep -q 'SHORTS · v0.8.0'
          unzip -l "$APK" | grep -q 'assets/fonts/GowunDodum-Regular.ttf'
          unzip -l "$APK" | grep -q 'assets/fonts/NanumPenScript-Regular.ttf'
          unzip -p "$APK" assets/styles.css | grep -Fq "@font-face{font-family:'Gowun Dodum'"
          unzip -p "$APK" assets/styles.css | grep -Fq "@font-face{font-family:'Nanum Pen Script'"
          grep -Fq "restoreBundledKoreanFontsV080" /tmp/ledoa-v080-app.js
          grep -Fq "Number(\$('textBgOpacity')?.value ?? 100)" /tmp/ledoa-v080-app.js
          echo "Verified preview recovery, zero opacity and loaded Korean font definitions inside APK."
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          if [ -f signing/v037_debug.keystore.b64 ]; then
            base64 -d signing/v037_debug.keystore.b64 > /tmp/ledoa-release.keystore
            "$ZIPALIGN" -f 4 "$APK" /tmp/ledoa-aligned.apk
            "$APKSIGNER" sign --ks /tmp/ledoa-release.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out LEDOA_CUT_Mobile_v0.8.0_TEXT_RESTORE.apk /tmp/ledoa-aligned.apk
            "$APKSIGNER" verify --verbose --print-certs LEDOA_CUT_Mobile_v0.8.0_TEXT_RESTORE.apk
          else
            cp "$APK" LEDOA_CUT_Mobile_v0.8.0_TEXT_RESTORE.apk
          fi
          sha256sum LEDOA_CUT_Mobile_v0.8.0_TEXT_RESTORE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Mobile_v0.8.0_TEXT_RESTORE
          path: LEDOA_CUT_Mobile_v0.8.0_TEXT_RESTORE.apk
          if-no-files-found: error

      - name: Publish signed v0.8.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=LEDOA_CUT_Mobile_v0.8.0_TEXT_RESTORE.apk
          if gh release view v0.8.0 >/dev/null 2>&1; then
            gh release upload v0.8.0 "$APK" --clobber
          else
            gh release create v0.8.0 "$APK" --title 'LEDOA CUT 모바일 v0.8.0' --notes 'v0.6.4 기준 한글 글꼴, 자막 배경 농도 0~100% 복구. v0.7.9 미리보기 디코더 복구 유지.'
          fi
