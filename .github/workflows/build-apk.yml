name: Build LEDOA CUT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'LEDOA_CUT_Mobile_Shorts_Standalone_v0.6.6_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v0.6.6 source
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q LEDOA_CUT_Mobile_Shorts_Standalone_v0.6.6_SOURCE.zip -d buildsrc
          echo "Top-level extracted files:"
          find buildsrc -maxdepth 3 -type f | head -100
          GRADLE_FILE=$(find buildsrc -type f \( -name build.gradle.kts -o -name build.gradle \) | grep '/app/' | head -1)
          test -n "$GRADLE_FILE"
          ANDROID_DIR=$(dirname "$(dirname "$GRADLE_FILE")")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "APP_GRADLE=$GRADLE_FILE" >> "$GITHUB_ENV"

      - name: Inspect face tracking source
        run: |
          set -euo pipefail
          APPJS=$(find buildsrc -type f -name app.js | head -1)
          echo "APPJS=$APPJS"
          sed -n '3250,3435p' "$APPJS"

      - name: Verify and normalize v0.7.3 clean v0.6.6 preview identity
        run: |
          set -euo pipefail
          echo "Using $APP_GRADLE"
          if grep -q 'versionCode[[:space:]]*=' "$APP_GRADLE"; then
            sed -i -E 's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 703/' "$APP_GRADLE"
          fi
          if grep -q 'versionName[[:space:]]*=' "$APP_GRADLE"; then
            sed -i -E 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "0.7.3"/' "$APP_GRADLE"
          fi
          grep -E 'applicationId|versionCode|versionName' "$APP_GRADLE" || true

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon :app:assembleDebug
          elif [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Locate and sign APK
        run: |
          set -euo pipefail
          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -1)
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          if [ -f signing/v037_debug.keystore.b64 ]; then
            base64 -d signing/v037_debug.keystore.b64 > /tmp/ledoa-release.keystore
            "$ZIPALIGN" -f 4 "$APK" /tmp/ledoa-aligned.apk
            "$APKSIGNER" sign --ks /tmp/ledoa-release.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out LEDOA_CUT_Mobile_v0.7.3_CLEAN_PREVIEW_RESTORE.apk /tmp/ledoa-aligned.apk
            "$APKSIGNER" verify --verbose --print-certs LEDOA_CUT_Mobile_v0.7.3_CLEAN_PREVIEW_RESTORE.apk
          else
            cp "$APK" LEDOA_CUT_Mobile_v0.7.3_CLEAN_PREVIEW_RESTORE.apk
          fi
          sha256sum LEDOA_CUT_Mobile_v0.7.3_CLEAN_PREVIEW_RESTORE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Mobile_v0.7.3_CLEAN_PREVIEW_RESTORE
          path: LEDOA_CUT_Mobile_v0.7.3_CLEAN_PREVIEW_RESTORE.apk
          if-no-files-found: error
