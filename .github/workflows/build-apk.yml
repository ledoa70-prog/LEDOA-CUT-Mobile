name: Build LEDOA CUT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source/chunk_00'
      - 'source/chunk_01'
      - 'source/chunk_02'
      - 'source/chunk_03'
      - 'source/v035_app.b64'
      - 'source/patch_index_034.b64'
      - 'source/patch_styles_034.b64'
      - 'source/v037_text_audio.js'
      - 'source/v037_overlay_core.js'
      - 'source/v037_overlay_ui.js'
      - 'source/v038_autosave_bgopacity.js'
      - 'signing/v037_debug.keystore.b64'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Android source from chunks
        run: |
          cat source/chunk_00 source/chunk_01 source/chunk_02 source/chunk_03 > source/android.b64
          base64 -d source/android.b64 > source/android.tar.gz
          gzip -t source/android.tar.gz
          rm -rf buildsrc
          mkdir -p buildsrc
          tar -xzf source/android.tar.gz -C buildsrc
          test -f buildsrc/android/app/build.gradle.kts

      - name: Apply v0.3.8 editor patch
        run: |
          set +e
          base64 -d source/v035_app.b64 | gzip -dc > buildsrc/android/app/src/main/assets/app.js
          base64 -d source/patch_index_034.b64 | gzip -dc > buildsrc/android/app/src/main/assets/index.html
          base64 -d source/patch_styles_034.b64 | gzip -dc > buildsrc/android/app/src/main/assets/styles.css
          set -e
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v037_text_audio.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v037_overlay_core.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v037_overlay_ui.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v038_autosave_bgopacity.js >> buildsrc/android/app/src/main/assets/app.js
          sed -i 's/SHORTS · v0.3.5/SHORTS · v0.3.8/g; s/SHORTS · v0.3.6/SHORTS · v0.3.8/g; s/SHORTS · v0.3.7/SHORTS · v0.3.8/g' buildsrc/android/app/src/main/assets/index.html
          test -s buildsrc/android/app/src/main/assets/app.js
          node --check buildsrc/android/app/src/main/assets/app.js
          grep -q 'v037TextPreset' buildsrc/android/app/src/main/assets/app.js
          grep -q 'v037OverlayAlpha' buildsrc/android/app/src/main/assets/app.js
          grep -q 'v038RestoreProject' buildsrc/android/app/src/main/assets/app.js
          grep -q 'textBgOpacity' buildsrc/android/app/src/main/assets/app.js
          grep -q 'indexedDB' buildsrc/android/app/src/main/assets/app.js
          grep -q 'SHORTS · v0.3.8' buildsrc/android/app/src/main/assets/index.html
          ! grep -P '[\x00-\x08\x0B\x0C\x0E-\x1F]' buildsrc/android/app/src/main/assets/index.html

      - name: Set version and stable signing key
        run: |
          MANIFEST=buildsrc/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          sed -i 's/applicationId = "[^"]*"/applicationId = "kr.ledoa.cut.standalone"/' buildsrc/android/app/build.gradle.kts
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 38/' buildsrc/android/app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "0.3.8"/' buildsrc/android/app/build.gradle.kts
          mkdir -p ~/.android
          base64 -d signing/v037_debug.keystore.b64 > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
          grep -E 'applicationId|versionCode|versionName' buildsrc/android/app/build.gradle.kts

      - name: Build signed debug APK
        working-directory: buildsrc/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify install package thoroughly
        run: |
          APK=buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='kr.ledoa.cut.standalone'" /tmp/badging.txt
          grep -q "launchable-activity: name='kr.ledoa.cut.MainActivity'" /tmp/badging.txt
          unzip -p "$APK" assets/index.html | grep -q 'SHORTS · v0.3.8'
          unzip -p "$APK" assets/app.js | grep -q 'v038RestoreProject'
          unzip -p "$APK" assets/app.js | grep -q 'textBgOpacity'
          unzip -p "$APK" assets/app.js | grep -q 'indexedDB'
          cp "$APK" LEDOA_CUT_Shorts_v0.3.8.apk
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Shorts_v0.3.8
          path: LEDOA_CUT_Shorts_v0.3.8.apk
          if-no-files-found: error
