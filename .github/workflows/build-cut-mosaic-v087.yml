name: Build and verify LEDOA CUT mobile mosaic v0.8.7
on:
  push:
    branches: [feature/cut-mobile-mosaic-v087]
    paths: ['cut-mobile-v087/**', '.github/workflows/build-cut-mosaic-v087.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            cut-mobile-v087/assets/alignment/model.onnx
            cut-mobile-v087/assets/sface_int8.onnx
          key: cut-models-0f1aa819-2b0e941e
      - name: Prepare pinned models and test clips
        run: |
          pip install onnx==1.17.0
          python cut-mobile-v087/prepare_models.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ASSETS=cut-mobile-v087/app/src/androidTest/assets
          mkdir -p "$ASSETS"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=30:duration=2 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -c:v libx264 -pix_fmt yuv420p -c:a aac -y "$ASSETS/sample.mp4"
          ffmpeg -hide_banner -loglevel error -i "$ASSETS/sample.mp4" -c copy -metadata:s:v rotate=90 -y "$ASSETS/rotated.mp4"
          curl --fail --location --retry 2 https://raw.githubusercontent.com/scikit-image/scikit-image/v0.25.2/skimage/data/astronaut.png -o /tmp/astronaut.png
          ffmpeg -hide_banner -loglevel error -loop 1 -i /tmp/astronaut.png -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 -vf scale=480:480 -r 30 -c:v libx264 -pix_fmt yuv420p -c:a aac -y "$ASSETS/faces.mp4"
      - name: Compile all editor, captions and mosaic Java sources
        working-directory: cut-mobile-v087
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 actual in-app edit, export, audio and restore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash -c 'gradle --no-daemon -p cut-mobile-v087 :app:connectedDebugAndroidTest; STATUS=$?; adb pull /sdcard/Android/data/kr.ledoa.cut.captionbeta/files device-evidence; exit "$STATUS"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LEDOA_CUT_MOBILE_v0.8.7_RESULTS
          path: |
            cut-mobile-v087/app/build/outputs/apk/debug/app-debug.apk
            cut-mobile-v087/app/build/reports/androidTests/
            cut-mobile-v087/app/build/outputs/androidTest-results/
            device-evidence/
          if-no-files-found: error
