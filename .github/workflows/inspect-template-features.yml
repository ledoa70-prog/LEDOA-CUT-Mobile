name: Inspect template features
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/inspect-template-features.yml' ]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect v0.6.6 template features
        run: |
          rm -rf /tmp/v66 && mkdir /tmp/v66
          unzip -q LEDOA_CUT_Mobile_Shorts_Standalone_v0.6.6_SOURCE.zip -d /tmp/v66
          HTML=$(find /tmp/v66 -type f -name index.html | head -1)
          JS=$(find /tmp/v66 -type f -name app.js | head -1)
          CSS=$(find /tmp/v66 -type f -name '*.css' | head -1)
          echo "=== HTML LEDOA TV / TWO LINE ==="
          grep -nEi -C 8 'LEDOA TV|두줄|강조|쇼츠 스타일|shorts.?style|two.?line|highlight' "$HTML" || true
          echo "=== JS LEDOA TV / TWO LINE ==="
          grep -nEi -C 12 'LEDOA TV|두줄|강조|쇼츠 스타일|shorts.?style|two.?line|highlight' "$JS" || true
          echo "=== CSS LEDOA TV / TWO LINE ==="
          grep -nEi -C 8 'LEDOA TV|두줄|강조|shorts|two.?line|highlight' "$CSS" || true
