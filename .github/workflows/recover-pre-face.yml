name: Recover LEDOA CUT timeline navigation
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/recover-pre-face.yml' ]
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 477f4a8ef5fe4993fa0d164e03f10cf78193274e
      - name: Checkout current repository for template source only
        uses: actions/checkout@v4
        with:
          path: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rebuild original pre-face source
        run: |
          cat source/chunk_00 source/chunk_01 source/chunk_02 source/chunk_03 > source/android.b64
          base64 -d source/android.b64 > source/android.tar.gz
          gzip -t source/android.tar.gz
          mkdir -p buildsrc
          tar -xzf source/android.tar.gz -C buildsrc
          base64 -d source/v035_app.b64 | gzip -dc > buildsrc/android/app/src/main/assets/app.js || true
          base64 -d source/patch_index_034.b64 | gzip -dc > buildsrc/android/app/src/main/assets/index.html || true
          base64 -d source/patch_styles_034.b64 | gzip -dc > buildsrc/android/app/src/main/assets/styles.css || true
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v037_text_audio.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v037_overlay_core.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v037_overlay_ui.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v038_autosave_bgopacity.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v039_text_overlay_fix.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v041_new_project.js >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          cat source/v043_text_commit_fix.js >> buildsrc/android/app/src/main/assets/app.js
          # Restore only the two frequently used title/template features from the later source.
          # Do NOT import playback, export, face tracking, or other later patches.
          rm -rf /tmp/v66 && mkdir -p /tmp/v66
          unzip -q latest/LEDOA_CUT_Mobile_Shorts_Standalone_v0.6.6_SOURCE.zip -d /tmp/v66
          LATER_JS=$(find /tmp/v66 -type f -name app.js | head -1)
          sed -n '726,1089p' "$LATER_JS" >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          sed -n '1505,1727p' "$LATER_JS" >> buildsrc/android/app/src/main/assets/app.js
          # Restore timeline navigation only: restart-to-zero and left/right viewport controls.
          sed -n '2676,2878p' "$LATER_JS" >> buildsrc/android/app/src/main/assets/app.js
          printf '\n' >> buildsrc/android/app/src/main/assets/app.js
          sed -n '2879,2914p' "$LATER_JS" >> buildsrc/android/app/src/main/assets/app.js
          cp source/v044_MainActivity.java buildsrc/android/app/src/main/java/kr/ledoa/cut/MainActivity.java
          sed -i 's/SHORTS · v0.3.5/SHORTS · v0.4.6/g; s/SHORTS · v0.3.6/SHORTS · v0.4.6/g; s/SHORTS · v0.3.7/SHORTS · v0.4.6/g; s/SHORTS · v0.3.8/SHORTS · v0.4.6/g; s/SHORTS · v0.3.9/SHORTS · v0.4.6/g; s/SHORTS · v0.4.0/SHORTS · v0.4.6/g; s/SHORTS · v0.4.1/SHORTS · v0.4.6/g; s/SHORTS · v0.4.2/SHORTS · v0.4.6/g; s/SHORTS · v0.4.3/SHORTS · v0.4.6/g' buildsrc/android/app/src/main/assets/index.html
          node --check buildsrc/android/app/src/main/assets/app.js
          grep -q "LEDOA TV Shorts title layout refinement" buildsrc/android/app/src/main/assets/app.js
          grep -q "two-line impact Shorts title template" buildsrc/android/app/src/main/assets/app.js
          grep -q "explicit left/right timeline viewport controls" buildsrc/android/app/src/main/assets/app.js
          grep -q "restart-to-zero transport control" buildsrc/android/app/src/main/assets/app.js
          ! grep -qiE 'faceMask|faceTracking|trackerVersion|얼굴 모자이크|자동추적' buildsrc/android/app/src/main/assets/app.js
      - name: Keep original package and version
        run: |
          MANIFEST=buildsrc/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"; fi
          sed -i 's/applicationId = "[^"]*"/applicationId = "kr.ledoa.cut.release"/' buildsrc/android/app/build.gradle.kts
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 702/' buildsrc/android/app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "0.4.6-timeline-nav"/' buildsrc/android/app/build.gradle.kts
      - name: Build
        working-directory: buildsrc/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Sign and verify with original LEDOA key
        run: |
          set -euo pipefail
          APK=buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          base64 -d signing/v037_debug.keystore.b64 > /tmp/ledoa.keystore
          "$ZIPALIGN" -f 4 "$APK" /tmp/ledoa-aligned.apk
          "$APKSIGNER" sign --ks /tmp/ledoa.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out LEDOA_CUT_Mobile_v0.4.6_TIMELINE_NAV.apk /tmp/ledoa-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs LEDOA_CUT_Mobile_v0.4.6_TIMELINE_NAV.apk
          "$AAPT2" dump badging LEDOA_CUT_Mobile_v0.4.6_TIMELINE_NAV.apk | tee /tmp/badging.txt
          grep -q "package: name='kr.ledoa.cut.release'" /tmp/badging.txt
          grep -q "versionCode='702'" /tmp/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LEDOA_CUT_Mobile_v0.4.6_TIMELINE_NAV
          path: LEDOA_CUT_Mobile_v0.4.6_TIMELINE_NAV.apk
          if-no-files-found: error
