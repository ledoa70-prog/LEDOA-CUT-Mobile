plugins { id 'com.android.application' }
def ledSigningStore = providers.gradleProperty('ledoaSigningStore').orNull
if (!ledSigningStore) throw new GradleException('Pass -PledoaSigningStore=/absolute/path/to/ledoa.keystore; random debug signing is not allowed.')
android {
    namespace 'kr.ledoa.cut.aitest'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.ledoa.cut.mosaic'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 28 // Test-only: avoid migration side effects; update after modern API regression tests.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        versionCode 901
        versionName '0.9.1-mosaic-editor'
    }
    signingConfigs {
        debug {
            storeFile file(ledSigningStore)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    // Compressed native libraries reduce the download size; Android extracts them on install.
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // Bundled model: no model download / no paid cloud inference.
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'org.opencv:opencv:4.10.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
